name: Deploy Orvexa AI Edge Function

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/smart-assistant/**'
      - '.github/workflows/deploy-smart-assistant.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Orvexa AI function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy smart-assistant --project-ref ruczzcnrkgnoftghoapr --use-api
